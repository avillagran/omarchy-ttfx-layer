[package]
name = "ttfx-bg-rs"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ttfx-bg-rs"
path = "src/main.rs"

[dependencies]
gtk4 = { version = "0.10", features = ["v4_16"] }
gtk4-layer-shell = "0.6"
vte4 = { version = "0.9", optional = true }
gio = "0.20"
glib = "0.20"
anyhow = "1"
gl = "0.14"
serde_json = "1"
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
rand = "0.8"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
# ttfx effects engine, vendored as a git submodule (ttfx-src/). Used as a LIBRARY
# so the background can drive ttfx's effects in-process (and, later, feed them the
# audio levels) instead of shelling out to a separate ttfx binary.
ttfx = { path = "../../ttfx-src" }

[features]
# The VTE terminal renderer. Without it the binary does not link libvte and
# uses the GPU layer (or the direct renderer) instead.
default = ["vte"]
vte = ["dep:vte4"]

[profile.release]
lto = true
strip = true
